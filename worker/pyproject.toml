[project]
name = "localscribe-worker"
version = "0.1.0"
description = "Local Apple Silicon speech-recognition worker for LocalScribe"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx==0.32.0",
  "mlx-audio[stt]==0.4.6",
  "mlx-whisper==0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localscribe_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ruff==0.16.0",
]
