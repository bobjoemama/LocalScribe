[project]
name = "localscribe-worker"
version = "0.1.0"
description = "Local MLX Whisper worker for LocalScribe"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx==0.32.0",
  "mlx-whisper==0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localscribe_worker"]
