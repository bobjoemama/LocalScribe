[project]
name = "localscribe-windows-faster-whisper-worker"
version = "0.1.0"
description = "LocalScribe faster-whisper/CTranslate2 CUDA worker for Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av==18.0.0; sys_platform == 'win32'",
  "ctranslate2==4.8.1; sys_platform == 'win32'",
  "faster-whisper==1.2.1; sys_platform == 'win32'",
  "huggingface-hub==1.24.0; sys_platform == 'win32'",
  "numpy==2.5.1; sys_platform == 'win32'",
  "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
  "nvidia-cuda-nvrtc-cu12==12.9.86; sys_platform == 'win32'",
  "nvidia-cudnn-cu12==9.25.0.15; sys_platform == 'win32'",
  "nvidia-ml-py==13.610.43; sys_platform == 'win32'",
  "onnxruntime==1.27.0; sys_platform == 'win32'",
  "tokenizers==0.23.1; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localscribe_windows_worker"]
