name: Signed release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  release-verify:
    name: Verify immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.11"
          enable-cache: true

      - name: Install and verify pinned npm
        run: |
          npm install --global npm@11.16.0
          npm run toolchain:verify:npm

      - name: Require version-matched tag
        shell: bash
        run: |
          release_version="$(node -p "require('./package.json').version")"
          expected_ref="refs/tags/v${release_version}"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "Release workflow requires $expected_ref; received $GITHUB_REF." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --strict-allow-scripts

      - name: Audit production JavaScript dependencies
        run: npm run audit:production

      - name: Audit the full JavaScript dependency graph
        run: npm run audit:all

      - name: Verify committed Python locks
        run: npm run worker:check-locks

      - name: Audit locked Python worker dependencies
        run: npm run audit:python

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --reporter=dot

  macos:
    name: Signed and notarized macOS release
    needs: release-verify
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.11"
          enable-cache: true

      - name: Install and verify pinned npm
        run: |
          npm install --global npm@11.16.0
          npm run toolchain:verify:npm

      - name: Install dependencies
        run: npm ci --strict-allow-scripts

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          certificate_path="$RUNNER_TEMP/localscribe-release.p12"
          keychain_path="$RUNNER_TEMP/localscribe-build.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$GITHUB_RUN_ID" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$GITHUB_RUN_ID" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build signed and notarized DMG
        env:
          LOCALSCRIBE_RELEASE: "1"
          LOCALSCRIBE_CODESIGN_IDENTITY: ${{ secrets.LOCALSCRIBE_CODESIGN_IDENTITY }}
          LOCALSCRIBE_UNDECLARED_MLX_LICENSE_APPROVED: ${{ vars.LOCALSCRIBE_UNDECLARED_MLX_LICENSE_APPROVED }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make:mac

      - name: Smoke packaged macOS main process
        run: npm run smoke:packaged:macos

      - name: Test macOS worker with bundled Python
        run: |
          resources/python-runtime/venv/bin/python \
            -m unittest discover -s worker/tests -v

      - name: Generate SBOM and checksums
        run: |
          set -euo pipefail
          npm run --silent sbom:runtime:macos > out/localscribe-core-runtime-macos-sbom.cdx.json
          npm run --silent sbom:python:macos > out/localscribe-python-macos-sbom.cdx.json
          (
            cd out
            {
              find make -type f \( -name '*.dmg' -o -name '*.zip' \) -print0
              printf '%s\0' \
                localscribe-core-runtime-macos-sbom.cdx.json \
                localscribe-python-macos-sbom.cdx.json
            } |
              xargs -0 shasum -a 256 > SHA256SUMS.txt
          )

      - name: Upload signed release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalScribe-macOS-SIGNED
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/localscribe-core-runtime-macos-sbom.cdx.json
            out/localscribe-python-macos-sbom.cdx.json
            out/SHA256SUMS.txt
          if-no-files-found: error

  windows:
    name: Signed Windows Squirrel release
    needs: release-verify
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.11"
          enable-cache: true

      - name: Install and verify pinned npm
        run: |
          npm install --global npm@11.16.0
          npm run toolchain:verify:npm

      - name: Install dependencies
        run: npm ci --strict-allow-scripts

      - name: Materialize signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64) {
            throw "WINDOWS_CERTIFICATE_PFX_BASE64 is required."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "localscribe-release.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          )
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed Squirrel Setup.exe
        env:
          LOCALSCRIBE_RELEASE: "1"
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        run: npm run make:windows

      - name: Smoke packaged Windows main process
        shell: pwsh
        run: npm run smoke:packaged:windows

      - name: Generate SBOM and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run --silent sbom:runtime:windows |
            Out-File -Encoding utf8 out/localscribe-core-runtime-windows-sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "Windows core-runtime SBOM generation failed." }
          npm run --silent sbom:python:windows |
            Out-File -Encoding utf8 out/localscribe-python-windows-sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "Windows Python SBOM generation failed." }
          $ChecksumTargets = @(
            Get-ChildItem out/make -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".nupkg") -or $_.Name -eq "RELEASES" }
            Get-Item out/localscribe-core-runtime-windows-sbom.cdx.json
            Get-Item out/localscribe-python-windows-sbom.cdx.json
          )
          $OutRoot = (Resolve-Path out).Path
          $ChecksumLines = $ChecksumTargets |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              $RelativePath = [IO.Path]::GetRelativePath($OutRoot, $_.Path).Replace("\", "/")
              "$($_.Hash.ToLowerInvariant())  $RelativePath"
            }
          [IO.File]::WriteAllText(
            (Join-Path $OutRoot "SHA256SUMS.txt"),
            (($ChecksumLines -join "`n") + "`n"),
            [Text.Encoding]::ASCII
          )

      - name: Upload signed release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalScribe-Windows-SIGNED
          path: |
            out/make/**/LocalScribe-Setup.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/localscribe-core-runtime-windows-sbom.cdx.json
            out/localscribe-python-windows-sbom.cdx.json
            out/SHA256SUMS.txt
          if-no-files-found: error
