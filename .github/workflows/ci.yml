name: Source CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

env:
  CI: "true"
  UV_PYTHON_DOWNLOADS: "never"

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source verification
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Source checks support Python 3.12. GitHub's macOS arm64 tool cache
          # does not publish 3.12.11+; the packaged runtime remains separately
          # pinned and digest-verified at 3.12.13.
          python-version: 3.12.10

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # setup-uv's version-file input expects a structured project file,
          # not LocalScribe's one-line toolchain pin.
          version: "0.11.11"
          enable-cache: false

      - name: Install the pinned npm version
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund

      - name: Install locked JavaScript dependencies
        run: npm ci --strict-allow-scripts

      - name: Run source verification
        run: npm run ci
